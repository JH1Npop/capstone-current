name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handoff-current:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require living handoff update
        env:
          HANDOFF_FILE: docs/quality/CURRENT_SYSTEM_AUDIT_AND_HANDOFF.md
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}"; then
            changed_files="$(git diff --name-only "$BEFORE_SHA..HEAD")"
          else
            changed_files="$(git show --pretty='' --name-only HEAD)"
          fi

          non_handoff_changes="$(printf '%s\n' "$changed_files" | grep -v -E "^$HANDOFF_FILE$|^$")"
          if [ -n "$non_handoff_changes" ] && ! printf '%s\n' "$changed_files" | grep -Fxq "$HANDOFF_FILE"; then
            echo "Repository changes require an update to $HANDOFF_FILE"
            echo "Changed files:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test --noinput --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit -r backend/requirements.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm --prefix frontend audit --package-lock-only --audit-level=high

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, dependency-security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          CI: 'true'
