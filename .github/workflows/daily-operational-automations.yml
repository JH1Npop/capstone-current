name: Daily operational automations

on:
  schedule:
    # GitHub schedules use UTC. 00:17 UTC is 08:17 in Asia/Manila (UTC+8).
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-operational-automations
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: production
      DEPLOYMENT_STAGE: ${{ secrets.AUTOMATION_DEPLOYMENT_STAGE }}
      DEBUG: 'False'
      ENABLE_HTTPS: 'True'
      USE_X_FORWARDED_PROTO: 'True'
      USE_X_FORWARDED_HOST: 'True'
      SECRET_KEY: ${{ secrets.AUTOMATION_SECRET_KEY }}
      ALLOWED_HOSTS: ${{ secrets.AUTOMATION_ALLOWED_HOSTS }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.AUTOMATION_CORS_ALLOWED_ORIGINS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.AUTOMATION_CSRF_TRUSTED_ORIGINS }}
      FRONTEND_BASE_URL: ${{ secrets.AUTOMATION_FRONTEND_BASE_URL }}
      DATABASE_URL: ${{ secrets.AUTOMATION_DATABASE_URL }}
      DB_SSLMODE: verify-full
      DB_CONNECT_TIMEOUT: '10'
      DB_CONN_MAX_AGE: '0'
      DB_CONN_HEALTH_CHECKS: 'True'
      CLOUDINARY_CLOUD_NAME: ${{ secrets.AUTOMATION_CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.AUTOMATION_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.AUTOMATION_CLOUDINARY_API_SECRET }}
      USE_REDIS: 'True'
      REDIS_URL: ${{ secrets.AUTOMATION_REDIS_URL }}
      EMAIL_BACKEND: afn_service_management.email_backends.BrevoEmailBackend
      BREVO_API_KEY: ${{ secrets.AUTOMATION_BREVO_API_KEY }}
      BREVO_API_TIMEOUT_SECONDS: '15'
      DEFAULT_FROM_EMAIL: ${{ secrets.AUTOMATION_DEFAULT_FROM_EMAIL }}
      AIVEN_CA_PEM: ${{ secrets.AUTOMATION_AIVEN_CA_PEM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_STAGE" != "staging" && "$DEPLOYMENT_STAGE" != "production" ]]; then
            echo "AUTOMATION_DEPLOYMENT_STAGE must be exactly staging or production."
            exit 1
          fi
          required=(
            SECRET_KEY ALLOWED_HOSTS CORS_ALLOWED_ORIGINS CSRF_TRUSTED_ORIGINS
            FRONTEND_BASE_URL DATABASE_URL CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET REDIS_URL BREVO_API_KEY DEFAULT_FROM_EMAIL AIVEN_CA_PEM
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required GitHub Actions secret for $key is missing."
              exit 1
            fi
          done

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare the Aiven CA certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/aiven-ca.pem"
          printf '%s' "$AIVEN_CA_PEM" > "$certificate_path"
          chmod 600 "$certificate_path"
          echo "DB_SSLROOTCERT=$certificate_path" >> "$GITHUB_ENV"

      - name: Validate Django configuration
        working-directory: backend
        run: python manage.py check

      - name: Run daily reminders and operational maintenance
        working-directory: backend
        run: python manage.py run_operational_automations --mode daily
