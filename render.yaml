services:
  - type: keyvalue
    name: afn-capstone-redis-staging
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: afn-capstone-backend-staging
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free Render services do not support pre-deploy commands. This is safe only
    # for the single-instance disposable staging environment defined here.
    startCommand: python manage.py migrate --noinput && daphne afn_service_management.asgi:application --bind 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/liveness/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DJANGO_ENV
        value: production
      - key: DEPLOYMENT_STAGE
        value: staging
      - key: DEBUG
        value: "False"
      - key: ENABLE_HTTPS
        value: "True"
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: verify-full
      - key: DB_SSLROOTCERT
        value: /etc/secrets/aiven-ca.pem
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: USE_REDIS
        value: "True"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: afn-capstone-redis-staging
          property: connectionString
      # Free Render web services block the common SMTP ports. Staging writes
      # messages to service logs; production must use a deliverable provider.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: AFN Service Staging <noreply@example.invalid>
      - key: TRACKING_REGION_NAME
        value: CALABARZON
      - key: TRACKING_REGION_SOUTH_LAT
        value: "13.38"
      - key: TRACKING_REGION_WEST_LNG
        value: "119.88"
      - key: TRACKING_REGION_NORTH_LAT
        value: "14.96"
      - key: TRACKING_REGION_EAST_LNG
        value: "122.42"
      - key: TRACKING_REGION_MIN_ZOOM
        value: "8"
      - key: TECHNICIAN_LOCATION_RETENTION_DAYS
        value: "30"
      - key: TECHNICIAN_LOCATION_TRAIL_MINUTES
        value: "60"

  - type: web
    name: afn-capstone-frontend-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
