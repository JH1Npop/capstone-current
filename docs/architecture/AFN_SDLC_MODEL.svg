<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Software Development Lifecycle Model for AFN Service Management System</title>
  <desc id="desc">An Agile sprint-based SDLC model showing project vision, release planning, sprint activities, deployment, and continuous improvement for the AFN Service Management System.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .phase-title { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .phase-body { font: 400 12px Arial, sans-serif; fill: #ffffff; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .box-body { font: 400 12px Arial, sans-serif; fill: #334155; }
      .small { font: 700 12px Arial, sans-serif; fill: #334155; }
      .center-title { font: 800 32px Arial, sans-serif; fill: #111827; }
      .center-body { font: 400 13px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="60" y="58" class="title">Software Development Lifecycle</text>
  <text x="60" y="84" class="subtitle">Agile sprint-based model for the AFN Service Management System</text>

  <!-- Project Vision -->
  <g filter="url(#soft-shadow)">
    <rect x="65" y="450" width="170" height="92" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="96" cy="483" r="17" fill="#f59e0b"/>
    <text x="89" y="488" font-family="Arial" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="122" y="477" class="box-title">Project Vision</text>
    <text x="122" y="499" class="box-body">Role-based service</text>
    <text x="122" y="516" class="box-body">request management</text>
  </g>

  <!-- Release Planning -->
  <g filter="url(#soft-shadow)">
    <rect x="275" y="450" width="190" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="306" cy="483" r="17" fill="#3b82f6"/>
    <text x="299" y="488" font-family="Arial" font-size="20" font-weight="700" fill="#fff">2</text>
    <text x="332" y="477" class="box-title">Release Planning</text>
    <text x="332" y="499" class="box-body">Users, requests, tickets,</text>
    <text x="332" y="516" class="box-body">jobs, after-sales, reports</text>
  </g>

  <!-- Deployment -->
  <g filter="url(#soft-shadow)">
    <path d="M760 468 H1050 L1105 496 L1050 524 H760 Z" fill="#10b981"/>
    <text x="835" y="489" class="phase-title">Deployment</text>
    <text x="835" y="510" class="phase-body">Migrations, frontend build, demo data, role testing</text>
  </g>

  <!-- Main sprint circle -->
  <circle cx="600" cy="318" r="132" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="538" y="311" class="center-title">SPRINT</text>
  <text x="507" y="336" class="center-body">Iterative build and validation</text>
  <text x="492" y="354" class="center-body">of connected system modules</text>

  <!-- Circular arrows / phases -->
  <path d="M505 205 A130 130 0 0 1 675 190" fill="none" stroke="#f59e0b" stroke-width="34" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <text x="523" y="177" transform="rotate(-16 523 177)" class="phase-title">Planning</text>
  <text x="514" y="197" transform="rotate(-16 514 197)" class="phase-body">features and user flows</text>

  <path d="M710 214 A130 130 0 0 1 735 365" fill="none" stroke="#2563eb" stroke-width="34" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="722" y="252" transform="rotate(54 722 252)" class="phase-title">Design</text>
  <text x="742" y="273" transform="rotate(54 742 273)" class="phase-body">models, APIs, pages</text>

  <path d="M700 412 A130 130 0 0 1 520 430" fill="none" stroke="#16a34a" stroke-width="34" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text x="590" y="478" transform="rotate(-7 590 478)" class="phase-title">Implementation</text>
  <text x="560" y="497" transform="rotate(-7 560 497)" class="phase-body">Django REST + React</text>

  <path d="M470 395 A130 130 0 0 1 455 252" fill="none" stroke="#dc2626" stroke-width="34" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <text x="375" y="365" transform="rotate(-73 375 365)" class="phase-title">Testing</text>
  <text x="357" y="344" transform="rotate(-73 357 344)" class="phase-body">checks, tests, builds</text>

  <!-- Sprint data cards -->
  <g filter="url(#soft-shadow)">
    <rect x="410" y="100" width="185" height="70" rx="12" fill="#fef3c7" stroke="#fde68a"/>
    <text x="430" y="126" class="box-title">Planning Data</text>
    <text x="430" y="147" class="box-body">Client requests, dispatch,</text>
    <text x="430" y="164" class="box-body">technician workflow</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="705" y="105" width="220" height="82" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="725" y="132" class="box-title">Design Data</text>
    <text x="725" y="153" class="box-body">User, ServiceRequest,</text>
    <text x="725" y="170" class="box-body">ServiceTicket, Checklist,</text>
    <text x="725" y="187" class="box-body">AfterSalesCase, ActivityLog</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="755" y="360" width="245" height="92" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
    <text x="775" y="387" class="box-title">Implementation Data</text>
    <text x="775" y="408" class="box-body">Admin, client, technician pages</text>
    <text x="775" y="425" class="box-body">connected to Django API flow</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="290" y="245" width="175" height="92" rx="12" fill="#fee2e2" stroke="#fecaca"/>
    <text x="310" y="272" class="box-title">Testing Data</text>
    <text x="310" y="293" class="box-body">Role checks, analytics,</text>
    <text x="310" y="310" class="box-body">messages, dashboards,</text>
    <text x="310" y="327" class="box-body">frontend build</text>
  </g>

  <!-- Review / continuous improvement -->
  <g filter="url(#soft-shadow)">
    <rect x="515" y="570" width="245" height="82" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="540" y="598" class="box-title">Review and Iteration</text>
    <text x="540" y="619" class="box-body">Fix disconnected cards, improve</text>
    <text x="540" y="636" class="box-body">analytics, clean unused modules</text>
  </g>

  <!-- Connectors -->
  <path d="M235 496 H275" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-blue)" fill="none"/>
  <path d="M465 496 C500 496 510 455 525 435" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M704 435 C725 462 735 486 760 496" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M760 612 C850 612 980 585 1040 525" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>

  <!-- Footer legend -->
  <text x="60" y="635" class="small">Core system flow:</text>
  <text x="60" y="657" class="subtitle">Client Request -> Admin Dispatch -> Technician Checklist -> Completion -> After-Sales/Maintenance -> Reports, Analytics, Activity Logs</text>
</svg>
