version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  AFN Service Management  –  Docker Compose
#  Stack: React/Vite (frontend) + Django/Daphne (backend) + SQLite or PostgreSQL/Aiven
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Django Backend (ASGI via Daphne) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afn-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      # Live-reload: mount source code into the container
      - ./backend:/app
      # Persist SQLite data across rebuilds
      - afn_sqlite_data:/app/data
      # Persist uploaded media files
      - afn_media:/app/media
    environment:
      # ── Django core ────────────────────────────────────────────────────────
      DJANGO_ENV: development
      DEBUG: "True"
      ENABLE_HTTPS: "False"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before starting Docker}"

      # ── Database ────────────────────────────────────────────────────────
      DATABASE_ENGINE: sqlite3
      SQLITE_DB_PATH: data/db.sqlite3
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-10}"
      DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-60}"

      # ── CORS / CSRF – allow Vite dev server origins ──────────────────────
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,testserver"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      CORS_ALLOW_CREDENTIALS: "True"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      FRONTEND_BASE_URL: "http://localhost:5174"

      # ── Channels – use in-memory layer (no Redis needed locally) ─────────
      USE_REDIS: "False"

      # ── Optional external APIs (leave as-is if unused) ───────────────────
      OPENROUTESERVICE_API_KEY: "${OPENROUTESERVICE_API_KEY:-}"
      ORS_API_KEY: "${ORS_API_KEY:-}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.gmail.com}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-AFN Service <noreply@afnservice.com>}"

    networks:
      - afn-net

  # ── React / Vite Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: afn-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      # Live-reload: mount source so Vite HMR sees file changes
      - ./frontend:/app
      # Don't override the container's node_modules with host's
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: /api
      VITE_DEV_SERVER_PORT: 5174
      # Points Vite's proxy to the 'backend' Docker service name
      VITE_BACKEND_HOST: http://backend:8000
    depends_on:
      - backend
    networks:
      - afn-net

# ─── Named volumes ─────────────────────────────────────────────────────────
volumes:
  afn_sqlite_data:
  afn_media:

# ─── Network ───────────────────────────────────────────────────────────────
networks:
  afn-net:
    driver: bridge
